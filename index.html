    }

      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      margin-bottom: 30px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .search-box {
      width: 100%;
    }

    .search-box input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-box input:focus {
      border-color: var(--primary);
    }

    .filter-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .filter-btn {
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease;
      color: var(--text-muted);
    }

    .filter-btn:hover, .filter-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr));
      gap: 24px;
    }

      background: var(--card-bg);
      border-radius: 12px;
      padding: 24px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.03);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.08);
    }

    .card-header {
      margin-bottom: 12px;
    }

    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      gap: 8px;
    }

    .seq-badge {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--accent);
      background: #fdf2e9;
      padding: 2px 8px;
      border-radius: 4px;
      white-space: nowrap;
    }

      font-size: 0.75rem;
      font-weight: 600;
      background: var(--primary-light);
      color: var(--primary);
      padding: 4px 10px;
      border-radius: 20px;

      line-height: 1.4;
      margin-bottom: 6px;

        locDetail: "新竹市 東區（中央商場與布市）",
        desc: "於新竹青聚點「見域」實作期間發起，創造吉祥物「Q比店長」，邀請布市老裁縫職人開辦棉花娃衣縫紉體驗工作坊，結合次文化咖啡館，成功引導大量年輕族群走入70餘年老布市。"

      {

        title: "小城中的潛流噪音",
        author: "黃妍寧",
        region: "多元跨區",
        locDetail: "次核心城市 / 城鄉過渡帶",
        desc: "採集現代化小城中常被日常屏蔽的微弱環境音（排水道潛流、工廠機具低鳴、冷氣壓縮機聲），轉化為聲音地景與藝術裝置，引導觀眾以雙耳重新聆聽城市發展帶來的環境隱性變遷。"

    const grid = document.getElementById('projectGrid');
    const searchInput = document.getElementById('searchInput');
    const filterBtns = document.querySelectorAll('.filter-btn');

    let currentRegion = 'all';
    let currentKeyword = '';

    // 防護 XSS
    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // 動態更新地區篩選按鈕計數
    function updateFilterCounts() {
      const counts = projects.reduce((acc, p) => {
        acc[p.region] = (acc[p.region] || 0) + 1;
        return acc;
      }, {});

      filterBtns.forEach(btn => {
        const reg = btn.getAttribute('data-region');
        if (reg === 'all') {
          btn.textContent = `全部地區 (${projects.length})`;
        } else if (counts[reg] !== undefined) {
          btn.textContent = `${reg} (${counts[reg]})`;
        }
      });
    }

    function renderCards() {
      grid.innerHTML = '';
      
      const filtered = projects.filter(item => {
        const matchesRegion = (currentRegion === 'all') || (item.region === currentRegion);
        const q = currentKeyword.toLowerCase();
        const matchesKeyword = !q || (
          item.title.toLowerCase().includes(q) ||
          item.author.toLowerCase().includes(q) ||
          item.desc.toLowerCase().includes(q) ||
          item.locDetail.toLowerCase().includes(q)
        );
        return matchesRegion && matchesKeyword;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="no-results">查無符合條件的企劃項目，請嘗試其他關鍵字或地區。</div>`;
        return;
      }

      filtered.forEach(p => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div>
            <div class="card-header">
              <div class="card-meta">
                <span class="seq-badge">NO.${escapeHtml(p.id)}</span>
                <span class="location-tag">📍 ${escapeHtml(p.locDetail)}</span>
              </div>
              <h3 class="card-title">${escapeHtml(p.title)}</h3>
              <div class="card-author">提案學員：${escapeHtml(p.author)}</div>
            </div>
            <p class="card-desc">${escapeHtml(p.desc)}</p>
          </div>
          <div class="card-footer">
            <span>區域所屬：${escapeHtml(p.region)}</span>
            <span>Dream Idea 績優點子</span>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        filterBtns.forEach(b => {
          b.classList.remove('active');
          b.setAttribute('aria-pressed', 'false');
        });
        btn.classList.add('active');
        btn.setAttribute('aria-pressed', 'true');
        currentRegion = btn.getAttribute('data-region');
        renderCards();
      });
    });

    searchInput.addEventListener('input', (e) => {
      currentKeyword = e.target.value.trim().toLowerCase();
      renderCards();
    });

    // 初始化執行
    updateFilterCounts();
    renderCards();
  </script>
</body>
