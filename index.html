<!DOCTYPE html>
<html lang="zh-Hant" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 台南行四天三夜行程安排</title>
    <style>
        /* === 低彩度陶磚紅 ✕ 深木質感配色系統 === */
        :root {
            /* 明亮模式：低飽和陶磚紅、深木色、暖白底 */
            --brick-main: #964f3c;      /* 沉穩低彩度磚紅 */
            --brick-hover: #7e3e2d;     /* 深焙磚紅 */
            --brick-soft: #f2e7e2;      /* 柔和磚紅淺底 */
            --brick-border: #d8bebe;    /* 柔化磚色邊框 */

            --wood-dark: #3a271d;       /* 深沉木褐 */
            --wood-muted: #6b5548;      /* 溫和木質茶棕 */
            --wood-tint: #eae3da;       /* 淺木色 */

            --bg-page: #f6f3ee;         /* 溫潤亞麻灰白 */
            --card-bg: #fdfbf8;         /* 暖白卡片底色 */
            --card-border: #ded5cb;     /* 溫和分隔線 */

            --text-title: #2b1c15;      /* 沉穩標題黑褐 */
            --text-main: #3b3028;       /* 正文深色 */
            --text-sub: #78685d;        /* 次要說明文字 */

            --time-bg: #f0e6e1;         /* 時間側欄：柔淡磚木灰粉 */
            --time-border: #e3d2cb;
            --time-text: #783827;       /* 時間文字：深磚紅 */

            --badge-gift-bg: #f5ebe6;
            --badge-gift-border: #dfc8c0;
            --badge-gift-text: #823e2d;

            --note-fixed-bg: #f2ede6;
            --note-fixed-border: #964f3c;
            --note-input-bg: #ffffff;

            --modal-bg: #fdfbf8;
            --shadow-sm: 0 2px 8px rgba(58, 39, 29, 0.05);
            --shadow-md: 0 8px 24px rgba(58, 39, 29, 0.09);
            --radius: 10px;
        }

        [data-theme="dark"] {
            /* 夜間模式：深邃炭木、洗鍊陶磚、低眩光沉香調 */
            --brick-main: #ba6d59;
            --brick-hover: #cf7e68;
            --brick-soft: #30201c;
            --brick-border: #52352d;

            --wood-dark: #eee0d5;
            --wood-muted: #b09c8f;
            --wood-tint: #231b17;

            --bg-page: #171311;
            --card-bg: #221b18;         /* 夜間溫暖暗木底 */
            --card-border: #382c26;

            --text-title: #f5ede6;
            --text-main: #e0d5cd;
            --text-sub: #a19286;

            --time-bg: #2d201c;
            --time-border: #442f28;
            --time-text: #d98f7c;

            --badge-gift-bg: #35231e;
            --badge-gift-border: #573a32;
            --badge-gift-text: #e09d8c;

            --note-fixed-bg: #1c1512;
            --note-fixed-border: #ba6d59;
            --note-input-bg: #181310;

            --modal-bg: #221b18;
            --shadow-sm: 0 2px 10px rgba(0, 0, 0, 0.35);
            --shadow-md: 0 8px 26px rgba(0, 0, 0, 0.55);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: background-color 0.22s ease, border-color 0.22s ease, color 0.18s ease;
        }

        body {
            /* 全面使用繁體中文無襯線黑體 */
            font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
            background-color: var(--bg-page);
            color: var(--text-main);
            line-height: 1.6;
            padding: 20px 16px 70px;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 960px;
            margin: 0 auto;
        }

        /* 頂部導航：夜間切換 */
        .top-navbar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 12px;
        }

        .theme-toggle-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background-color: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--card-border);
            padding: 6px 14px;
            font-size: 0.85rem;
            font-weight: 500;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: var(--shadow-sm);
        }

        .theme-toggle-btn:hover {
            border-color: var(--brick-main);
            color: var(--brick-main);
        }

        /* === 重新設計之黑體風格視覺標題（凸顯、大器、不突兀） === */
        .hero-banner {
            text-align: center;
            padding: 24px 20px 22px;
            margin-bottom: 24px;
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-top: 4px solid var(--brick-main); /* 沉穩磚紅頂部重點線 */
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            position: relative;
        }

        .hero-tag {
            display: inline-block;
            font-size: 0.82rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--brick-main);
            background-color: var(--brick-soft);
            padding: 3px 12px;
            border-radius: 4px;
            margin-bottom: 10px;
        }

        .hero-main-title {
            font-size: 2.05rem;
            font-weight: 800;
            color: var(--text-title);
            letter-spacing: 1px;
            line-height: 1.3;
            margin-bottom: 8px;
        }

        .hero-divider {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin: 10px 0;
        }

        .divider-line {
            width: 44px;
            height: 2px;
            background-color: var(--brick-main);
            opacity: 0.5;
            border-radius: 1px;
        }

        .divider-dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background-color: var(--brick-main);
        }

        .hero-sub-title {
            font-size: 0.94rem;
            color: var(--text-sub);
            letter-spacing: 0.4px;
        }

        /* 控制列：Tab 切換與 Markdown 匯出 */
        .controls-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 22px;
            background-color: var(--wood-tint);
            border: 1px solid var(--card-border);
            padding: 7px 9px;
            border-radius: var(--radius);
        }

        .tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .tab-btn {
            background-color: transparent;
            border: none;
            outline: none;
            padding: 8px 18px;
            font-size: 0.93rem;
            font-weight: 700;
            color: var(--text-sub);
            border-radius: 7px;
            cursor: pointer;
            font-family: inherit;
        }

        .tab-btn:hover {
            color: var(--brick-main);
            background-color: rgba(255, 255, 255, 0.55);
        }

        .tab-btn.active {
            background-color: var(--card-bg);
            color: var(--brick-main);
            box-shadow: var(--shadow-sm);
        }

        .btn-export {
            background-color: var(--brick-main);
            color: #ffffff;
            border: none;
            outline: none;
            padding: 8px 16px;
            font-size: 0.88rem;
            font-weight: 700;
            border-radius: 7px;
            cursor: pointer;
            font-family: inherit;
        }

        .btn-export:hover {
            background-color: var(--brick-hover);
        }

        /* 日程內容區塊 */
        .schedule-tab-content {
            display: none;
        }

        .schedule-tab-content.active {
            display: block;
        }

        .cards-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* 行程卡片：暖白底色、俐落黑體排版 */
        .card {
            display: flex;
            align-items: stretch;
            background-color: var(--card-bg);
            border-radius: var(--radius);
            border: 1px solid var(--card-border);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
        }

        .card:hover {
            border-color: var(--brick-main);
            box-shadow: var(--shadow-md);
        }

        /* 左側時間欄位（垂直 100% 滿高，沉穩淡磚灰粉） */
        .time-sidebar {
            width: 135px;
            min-width: 135px;
            background-color: var(--time-bg);
            color: var(--time-text);
            border-right: 1px solid var(--time-border);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px 10px;
            text-align: center;
            user-select: none;
        }

        .time-text {
            font-weight: 800;
            font-size: 1.05rem;
            line-height: 1.35;
            letter-spacing: 0.3px;
        }

        .time-flex-label {
            font-size: 0.82rem;
            color: var(--time-text);
            font-weight: 600;
            opacity: 0.85;
        }

        /* 右側主要內容 */
        .card-body {
            flex: 1;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 9px;
            min-width: 0;
        }

        /* 標題與地圖跳轉橫列 */
        .card-header-row {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
        }

        .place-title {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--text-title);
            line-height: 1.35;
        }

        /* Google Maps 跳轉按鈕（低彩度磚紅框線） */
        .map-jump-btn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background-color: transparent;
            color: var(--brick-main);
            border: 1px solid var(--brick-main);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 700;
            text-decoration: none;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .map-jump-btn:hover {
            background-color: var(--brick-main);
            color: #ffffff;
        }

        /* 地點介紹 */
        .info-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            font-size: 0.92rem;
        }

        .info-row {
            display: flex;
            align-items: baseline;
            gap: 8px;
        }

        .info-label {
            color: var(--text-sub);
            font-weight: 700;
            font-size: 0.85rem;
            min-width: 68px;
            flex-shrink: 0;
        }

        .info-val {
            color: var(--text-main);
            flex: 1;
        }

        /* 伴手禮標籤 */
        .souvenir-tag-box {
            display: inline-flex;
            align-items: center;
            background-color: var(--badge-gift-bg);
            color: var(--badge-gift-text);
            border: 1px solid var(--badge-gift-border);
            padding: 2px 9px;
            border-radius: 5px;
            font-size: 0.85rem;
            font-weight: 700;
            width: fit-content;
        }

        /* 行程原定備註 */
        .orig-note-box {
            background-color: var(--note-fixed-bg);
            border-left: 3px solid var(--brick-main);
            padding: 6px 12px;
            font-size: 0.88rem;
            color: var(--text-main);
            border-radius: 0 5px 5px 0;
        }

        /* 臨時筆記撰寫區 */
        .temp-note-row {
            margin-top: 3px;
            display: flex;
            align-items: center;
            gap: 8px;
            background-color: var(--note-input-bg);
            border: 1px dashed var(--card-border);
            padding: 5px 10px;
            border-radius: 6px;
        }

        .temp-note-label {
            color: var(--text-sub);
            font-weight: 700;
            font-size: 0.83rem;
            min-width: 65px;
            flex-shrink: 0;
        }

        .temp-note-input {
            flex: 1;
            border: 1px solid transparent;
            background: transparent;
            font-size: 0.88rem;
            font-family: inherit;
            color: var(--text-main);
            padding: 4px 6px;
            border-radius: 4px;
        }

        .temp-note-input:focus {
            outline: none;
            border-color: var(--brick-main);
            background-color: var(--card-bg);
        }

        /* Modal 彈窗 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(22, 16, 13, 0.62);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal-card {
            background-color: var(--modal-bg);
            border-radius: var(--radius);
            max-width: 740px;
            width: 100%;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid var(--card-border);
            box-shadow: var(--shadow-md);
        }

        .modal-header {
            padding: 15px 18px;
            background-color: var(--wood-tint);
            border-bottom: 1px solid var(--card-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h3 {
            font-size: 1.1rem;
            color: var(--text-title);
            font-weight: 800;
        }

        .modal-close-btn {
            background: none;
            border: none;
            font-size: 1.35rem;
            cursor: pointer;
            color: var(--text-sub);
            line-height: 1;
        }

        .modal-body {
            padding: 16px 18px;
            overflow-y: auto;
            flex: 1;
        }

        .markdown-textarea {
            width: 100%;
            height: 330px;
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace;
            font-size: 0.88rem;
            line-height: 1.55;
            padding: 12px;
            border: 1px solid var(--card-border);
            border-radius: 7px;
            background-color: var(--note-input-bg);
            color: var(--text-main);
            resize: vertical;
        }

        .modal-footer {
            padding: 12px 18px;
            border-top: 1px solid var(--card-border);
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            background-color: var(--wood-tint);
        }

        .btn-secondary {
            background-color: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--card-border);
            padding: 7px 15px;
            font-size: 0.88rem;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
        }

        .btn-secondary:hover {
            border-color: var(--brick-main);
            color: var(--brick-main);
        }

        .copy-toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(28, 20, 17, 0.92);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 0.88rem;
            font-weight: 600;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.25s ease;
            z-index: 1100;
        }

        .copy-toast.show {
            opacity: 1;
        }

        /* 手機適配 */
        @media (max-width: 640px) {
            .hero-main-title {
                font-size: 1.6rem;
            }
            .controls-bar {
                flex-direction: column;
                align-items: stretch;
            }
            .tabs {
                justify-content: space-between;
            }
            .tab-btn {
                flex: 1;
                text-align: center;
                padding: 7px 3px;
                font-size: 0.82rem;
            }
            .btn-export {
                text-align: center;
            }
            .time-sidebar {
                width: 90px;
                min-width: 90px;
                padding: 12px 6px;
            }
            .time-text {
                font-size: 0.85rem;
            }
            .card-body {
                padding: 13px;
            }
            .card-header-row {
                flex-direction: column;
                align-items: flex-start;
                gap: 6px;
            }
            .place-title {
                font-size: 1.05rem;
            }
            .map-jump-btn {
                align-self: flex-start;
            }
        }
    </style>
</head>

<div class="container">
    <!-- 深淺模式切換 -->

            <span id="themeIcon">☀️</span>
            <span id="themeLabel">明亮模式</span>
        </button>
    </div>

    <!-- 重新設計之視覺標題卡（黑體、磚紅重點線、精緻幾何對稱） -->
    <header class="hero-banner">
        <div class="hero-tag">TAINAN TRIP 2026</div>
        <h1 class="hero-main-title">2026 台南慢步・四天三夜遊程</h1>

    <!-- 日程分頁與匯出按鈕 -->
    <div class="controls-bar">
        <div class="tabs" id="tabButtonsContainer"></div>
        <button class="btn-export" id="openExportModalBtn">輸出純 Markdown 筆記</button>
    </div>

    <!-- 每日行程內容區 -->
    <div id="tabContentsContainer"></div>
</div>

<!-- Markdown 彈出視窗 -->
<div class="modal-overlay" id="exportModal">
    <div class="modal-card">
        <div class="modal-header">
            <h3>純文字階層式 Markdown 筆記</h3>
            <button class="modal-close-btn" id="closeExportModalBtn">&times;</button>
        </div>
        <div class="modal-body">
            <p style="font-size: 0.85rem; color: var(--text-sub); margin-bottom: 8px;">
                純文字階層式格式，已整合原定備註與您填寫的臨時筆記，完全無任何表情符號與營業時間：
            </p>
            <textarea class="markdown-textarea" id="markdownOutputText" readonly></textarea>
        </div>
        <div class="modal-footer">
            <button class="btn-secondary" id="downloadMdBtn">下載 .md 檔案</button>
            <button class="btn-export" id="copyMdBtn">複製 Markdown 內容</button>
        </div>
    </div>
</div>

<!-- 提示框 -->
<div class="copy-toast" id="toastMsg">已複製到剪貼簿！</div>

    let currentDayIndex = 0;

    const tabButtonsContainer = document.getElementById('tabButtonsContainer');
    const tabContentsContainer = document.getElementById('tabContentsContainer');
    const exportModal = document.getElementById('exportModal');
    const closeExportModalBtn = document.getElementById('closeExportModalBtn');
    const openExportModalBtn = document.getElementById('openExportModalBtn');
    const markdownOutputText = document.getElementById('markdownOutputText');
    const copyMdBtn = document.getElementById('copyMdBtn');
    const downloadMdBtn = document.getElementById('downloadMdBtn');
    const toastMsg = document.getElementById('toastMsg');
    
    // 主題模式控制
    const themeToggleBtn = document.getElementById('themeToggleBtn');
    const themeIcon = document.getElementById('themeIcon');
    const themeLabel = document.getElementById('themeLabel');

    function applyTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem('tainan_trip_theme', theme);
        if (theme === 'dark') {
            themeIcon.textContent = '🌙';
            themeLabel.textContent = '夜間模式';
        } else {
            themeIcon.textContent = '☀️';
            themeLabel.textContent = '明亮模式';
        }
    }

    themeToggleBtn.addEventListener('click', () => {
        const currentTheme = document.documentElement.getAttribute('data-theme') || 'light';
        applyTheme(currentTheme === 'dark' ? 'light' : 'dark');
    });

    // 初始化主題
    const savedTheme = localStorage.getItem('tainan_trip_theme') || 'light';
    applyTheme(savedTheme);

    function initUI() {
        tabButtonsContainer.innerHTML = '';
        tabContentsContainer.innerHTML = '';

        itineraryData.forEach((day, dIdx) => {
            // Tab 按鈕
            const tabBtn = document.createElement('button');
            tabBtn.className = `tab-btn ${dIdx === currentDayIndex ? 'active' : ''}`;
            tabBtn.textContent = day.day_title.split(' ')[0];
            tabBtn.title = day.day_title;
            tabBtn.addEventListener('click', () => switchDay(dIdx));
            tabButtonsContainer.appendChild(tabBtn);

            // Tab 內容
            const dayContent = document.createElement('div');
            dayContent.className = `schedule-tab-content ${dIdx === currentDayIndex ? 'active' : ''}`;
            dayContent.id = `content-${day.day_id}`;

            const cardsList = document.createElement('div');
            cardsList.className = 'cards-list';

            day.items.forEach((item, itemIdx) => {
                const card = document.createElement('div');
                card.className = 'card';

                // 時間顯示處理 (垂直滿高)
                let timeDisplayHtml = '';
                if (item.time) {
                    timeDisplayHtml = `<div class="time-text">${item.time.replace('-', '<br>至<br>')}</div>`;
                } else {
                    timeDisplayHtml = `<div class="time-flex-label">接續行程<br>/ 彈性時段</div>`;
                }

                // Google Map 跳轉按鈕
                let mapBtnHtml = '';
                if (item.map_query && item.map_query.trim() !== '') {
                    const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.map_query)}`;
                    mapBtnHtml = `<a href="${mapUrl}" target="_blank" class="map-jump-btn" title="在 Google 地圖開啟此地點">地圖導航 ↗</a>`;
                }

                // 伴手禮處理：僅在有特別指定時顯示
                const souvenirHtml = (item.souvenir && item.souvenir.trim() !== '') 
                    ? `<div class="info-row">
                            <span class="info-label">伴手禮：</span>
                            <div class="souvenir-tag-box">${item.souvenir}</div>
                       </div>` 
                    : '';

                // 行程原定備註：僅在原本有寫的地方直接保留
                const origNoteHtml = (item.orig_note && item.orig_note.trim() !== '') 
                    ? `<div class="orig-note-box">
                            <strong>行程備註：</strong>${item.orig_note}
                       </div>` 
                    : '';

                card.innerHTML = `
                    <div class="time-sidebar">
                        ${timeDisplayHtml}
                    </div>
                    <div class="card-body">
                        <div class="card-header-row">
                            <div class="place-title">${item.title}</div>
                            ${mapBtnHtml}
                        </div>
                        <div class="info-group">
                            <div class="info-row">
                                <span class="info-label">地點介紹：</span>
                                <span class="info-val">${item.desc}</span>
                            </div>
                            ${souvenirHtml}
                        </div>
                        ${origNoteHtml}
                        <div class="temp-note-row">
                            <span class="temp-note-label">臨時筆記：</span>
                            <input type="text" 
                                   class="temp-note-input" 
                                   placeholder="點此輸入自訂筆記..." 
                                   value="${item.temp_note || ''}" 
                                   data-day="${dIdx}" 
                                   data-item="${itemIdx}">
                        </div>
                    </div>
                `;
                cardsList.appendChild(card);
            });

            dayContent.appendChild(cardsList);
            tabContentsContainer.appendChild(dayContent);
        });

        // 監聽臨時筆記輸入
        document.querySelectorAll('.temp-note-input').forEach(input => {
            input.addEventListener('input', (e) => {
                const dIdx = parseInt(e.target.dataset.day, 10);
                const iIdx = parseInt(e.target.dataset.item, 10);
                itineraryData[dIdx].items[iIdx].temp_note = e.target.value.trim();
            });
        });
    }

    function switchDay(index) {
        currentDayIndex = index;
        document.querySelectorAll('.tab-btn').forEach((btn, i) => {
            btn.classList.toggle('active', i === index);
        });
        document.querySelectorAll('.schedule-tab-content').forEach((content, i) => {
            content.classList.toggle('active', i === index);
        });
    }

    // 產生純文字階層式筆記 Markdown（無 Emoji、無營業時間）
    function generateHierarchicalMarkdown() {
        let md = `# 2026 台南行四天三夜行程安排\n\n`;

        itineraryData.forEach(day => {
            md += `## ${day.day_title}\n`;

            day.items.forEach(item => {
                const timePrefix = item.time ? `[${item.time}] ` : '';
                md += `- ${timePrefix}${item.title}\n`;
                
                if (item.desc) {
                    md += `  - 地點介紹：${item.desc}\n`;
                }
                if (item.souvenir && item.souvenir.trim() !== '') {
                    md += `  - 伴手禮：${item.souvenir}\n`;
                }
                if (item.orig_note && item.orig_note.trim() !== '') {
                    md += `  - 行程備註：${item.orig_note}\n`;
                }
                if (item.temp_note && item.temp_note.trim() !== '') {
                    md += `  - 臨時筆記：${item.temp_note}\n`;
                }
            });
            md += `\n`;
        });

        return md;
    }

    openExportModalBtn.addEventListener('click', () => {
        const mdText = generateHierarchicalMarkdown();
        markdownOutputText.value = mdText;
        exportModal.classList.add('open');
    });

    closeExportModalBtn.addEventListener('click', () => {
        exportModal.classList.remove('open');
    });

    exportModal.addEventListener('click', (e) => {
        if (e.target === exportModal) {
            exportModal.classList.remove('open');
        }
    });

    copyMdBtn.addEventListener('click', () => {
        markdownOutputText.select();
        navigator.clipboard.writeText(markdownOutputText.value).then(() => {
            showToast("已成功複製階層式 Markdown 筆記！");
        }).catch(() => {
            document.execCommand('copy');
            showToast("已成功複製階層式 Markdown 筆記！");
        });
    });

    downloadMdBtn.addEventListener('click', () => {
        const mdContent = markdownOutputText.value;
        const blob = new Blob([mdContent], { type: 'text/markdown;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = '2026台南行行程筆記.md';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast("已下載 .md 檔案！");
    });

    function showToast(msg) {
        toastMsg.textContent = msg;
        toastMsg.classList.add('show');
        setTimeout(() => {
            toastMsg.classList.remove('show');
        }, 2200);
    }

    initUI();
</script>
